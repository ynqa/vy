[package]
name = "vy-cli"
version = "0.1.0"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
edition = "2024"
description = "Explore and query JSON and YAML, right in your terminal."
repository = "https://github.com/ynqa/vy"
homepage = "https://vy.ynqa.dev"
license = "MIT"
readme = "README.md"
include = [
    "/src/**",
    "/default.toml",
    "/config.schema.json",
    "/README.md",
    "/LICENSE",
    "/Cargo.lock",
]

[[bin]]
name = "vy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
filedescriptor = "0.8.3"
futures = "0.3.34"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
jaq-all = "0.3.0"
jaq-json = { version = "2.0.3", default-features = false, features = ["sync"] }
nucleo-matcher = "0.3.1"
promkit = { version = "0.17.0", features = [
    "json",
    "prefixsearch",
    "serde",
    "terminal-session",
    "text",
    "texteditor",
    "yaml",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yaml = "0.9.34"
shlex = "2.0.1"
termcfg = { version = "0.2.0", features = ["crossterm_0_29_0"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
schemars = "1.2.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true

[package.metadata.dist]
formula = "vy"
include = ["default.toml", "config.schema.json"]

[[package.metadata.dist.extra-artifacts]]
artifacts = ["default.toml", "config.schema.json"]
build = ["cargo", "test", "--locked", "config::schema::export", "--", "--ignored", "--exact"]
